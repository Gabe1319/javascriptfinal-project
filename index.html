<html lang="en">
<head>

  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
  <title>Javascipt final project</title>
</head>
<body>
  <Section id="nav">
    <Nav>
      <div class="nav__container">
        <img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTULSH4yVfFIrB08gxf9Pp6uSIz5T5uKqM7nAfkLkorVA&s=10">
      <ul class="nav__links">

        <li><a href="#" class="nav__link">Contact us</a></li>
      </ul>
      </div>
    </Nav>
  </Section>
  <section id="landing-page">
    <header>
      <div class="header__container">
        <div class="header__description">
        <h1>Your #1 Source for trivia questions </h1>
        <p>With # of catergory with 3 levels of difficulty</p>
        <div class="header__email">
      <input class="header__email--input" type="text"
      placeholder="Search by category">
    <button class="header__email--btn" onclick(filter)>Enter</button></div></div>
      </div>
    </header>
  </section>
  <main id="trivia__main">
  <section>
    <div class="container">
      <div class="row">
        <div class="trivia__header">
          <h2>All questions</h2>
          <select id="filter">
            <option value="" disabled selected>Sort</option>
            <option value="EASY">EASY</option>
            <option value="MEDUIM">MEDUIM</option>
            <option value="HARD">HARD</option>
            <option value="ALL">ALL</option>
          </select></div>
          
            <div class="question-list">
          </div>
          

        </div>
      </div>
    </div>
    


    
  </section>
  </main>
  <Section>
    <Footer>
<div class="container">
  <div class="row">
    <a href="#">
      <figure class="footer__logo"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTULSH4yVfFIrB08gxf9Pp6uSIz5T5uKqM7nAfkLkorVA&s=10" class="footer__logo-img"></figure>

</div>
